name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Free disk space
        run: |
          # See ci.yml. The guard at the end is the point of this step: it fails here,
          # with a message that says what is wrong, instead of several minutes into the
          # build with "No space left on device".
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /opt/hostedtoolcache \
            /usr/local/share/boost
          sudo docker image prune -af || true
          df -h /
          avail_gb=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          case "$avail_gb" in
            '' | *[!0-9]*)
              echo "::error::could not read free space from df" >&2
              exit 1
              ;;
          esac
          echo "free on /: ${avail_gb}G"
          if [ "$avail_gb" -lt 25 ]; then
            echo "::error::only ${avail_gb}G free on /; the ISO build needs about 25G" >&2
            exit 1
          fi
      - name: Make /dev/kvm usable
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -w /dev/kvm
      - name: Build the ISO
        run: nix build .#packages.x86_64-linux.iso -L --max-jobs 4
      - name: Boot the image that is about to be published
        run: |
          # The light image is boot-tested on every push; this is the same assertion
          # against the artifact that ships, applications and all. A step that has only
          # ever run on a tag is untested code.
          # --no-link: without it, `nix build` repoints ./result at the check's own output,
          # and the steps that follow (checksums, notes, release assets) then read a
          # ./result that no longer holds the ISO.
          nix build --no-link --option extra-sandbox-paths /dev/kvm -L .#checks.x86_64-linux.boot-test-release-bios
          nix build --no-link --option extra-sandbox-paths /dev/kvm -L .#checks.x86_64-linux.boot-test-release-efi
      - name: Size budget and closure manifest
        run: |
          # The budget fails the release if the image drifted past its measured ceiling
          # (docs/budget.md). The manifest is what the release page publishes instead of a
          # promise, and it describes the system an install produces - not the medium:
          # rooted at the image it would come out with a single entry, the ISO file,
          # because a compressed squashfs hides the store paths inside it from a
          # reference scan.
          #
          # Both keep ./result pointing at the ISO: the budget through --no-link, the
          # manifest through an out-link that .gitignore already covers.
          nix build --no-link -L .#packages.x86_64-linux.size-budget-installer
          nix build -L --out-link result-manifest .#packages.x86_64-linux.closure-manifest-appliance
      - name: Checksums
        run: |
          # Bare filenames, so that `sha256sum -c SHA256SUMS` works in the directory a
          # user downloaded into, where `result/iso/...` does not exist.
          #
          # The manifest is covered too: this file is the one document that lists
          # everything the release publishes, and it is the one that gets signed.
          (cd result/iso && sha256sum *.iso) > SHA256SUMS
          (cd result-manifest && sha256sum closure-*.json closure-sri-*.tsv) >> SHA256SUMS
          cat SHA256SUMS
      - name: Detect the signing key
        id: sig
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          # Signing is optional, and its absence is announced rather than fatal: a release
          # whose artifacts are built, boot-tested and attested should not be thrown away
          # because a key is missing. The notes below say which of the two happened, so the
          # page never claims a signature the download does not carry.
          if [ -n "$MINISIGN_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::MINISIGN_SECRET_KEY is absent - the release will not be signed"
          fi
      - name: Sign the checksums
        if: steps.sig.outputs.enabled == 'true'
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          # minisign reads its password neither from the environment nor from stdin: it
          # asks the terminal, which CI does not have. The key in the secret must therefore
          # be UNENCRYPTED (`minisign -G -W`), the only non-interactive mode upstream
          # supports. The public key is committed as easy-nix.pub, so a signature is
          # checkable without GitHub being reachable or trusted.
          mkdir -p ~/.minisign
          printf '%s\n' "$MINISIGN_KEY" > ~/.minisign/easy-nix.key
          nix run nixpkgs#minisign -- -S -s ~/.minisign/easy-nix.key -m SHA256SUMS
          rm -f ~/.minisign/easy-nix.key
          cat SHA256SUMS.minisig
          # Verify the signature against the key the repository publishes, not against
          # the one that just signed: they are two independent files, and the reader
          # only has the first. Without this, a secret whose public half was never
          # committed produces a release whose documented check fails for everyone.
          nix run nixpkgs#minisign -- -V -p easy-nix.pub -m SHA256SUMS
          echo "signed with the key committed as easy-nix.pub"
      - name: Split the image for GitHub's asset limit
        run: |
          # GitHub refuses any release asset of 2 GiB or more, and this image is about
          # 4 GiB because it carries the applications, which is what lets an install work
          # without the network. Parts of 1900 MiB stay under the limit whatever the image
          # grows to, and the release notes say how to put them back together.
          #
          # The parts go into the workspace, not beside the image: `result/iso` is a
          # read-only Nix store path, so writing there fails with "Permission denied"
          # after the build has already run. The assembled image stays where it is,
          # because the provenance below is filed against that file, not against the parts.
          ISO=$(basename "$(ls result/iso/*.iso)")
          mkdir -p release
          split -b 1900M --numeric-suffixes=1 --suffix-length=2 "result/iso/$ISO" "release/$ISO.part-"
          ls -lh release
      - name: Write the release notes
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          SIGNED: ${{ steps.sig.outputs.enabled }}
        run: |
          ISO=$(basename "$(ls result/iso/*.iso)")
          {
            echo "## easy-nix $TAG"
            echo
            echo "x86_64 installer. GitHub refuses a single release asset of 2 GiB or more and"
            echo "this image is about 4 GiB, so it ships in parts. Reassemble it, and verify"
            echo "the result before writing anything to a disk:"
            echo
            echo '```sh'
            echo "cat ${ISO}.part-* > $ISO"
            echo "sha256sum -c SHA256SUMS"
            echo '```'
            echo
            echo "Then write **$ISO** to a USB stick and boot it. It comes up as a live"
            echo "system, so you can check the screen, the keyboard and the wifi before any"
            echo "disk is touched, and it carries the applications, so the install itself does"
            echo "not need the network. Launch **Install easy-nix** from the desktop, or run"
            echo "\`sudo easy-nix-install\` from a terminal."
            echo
            echo "| part | size | sha256 |"
            echo "| --- | --- | --- |"
            for f in release/*.part-*; do
              printf '| %s | %s | %s |\n' "$(basename "$f")" "$(du -h "$f" | cut -f1)" "$(sha256sum "$f" | cut -d' ' -f1)"
            done
            echo
            echo "Assembled: $(du -h "result/iso/$ISO" | cut -f1), sha256"
            echo "\`$(sha256sum "result/iso/$ISO" | cut -d' ' -f1)\` - which is the line \`SHA256SUMS\`"
            echo "records, and the digest the provenance below is filed against."
            echo
            # Optional, and the page must not claim the opposite of what it ships: a
            # hard-coded "signed" section would quietly become a lie the day the key
            # disappears from the repository.
            if [ "${SIGNED}" = "true" ]; then
              echo "### Signed"
              echo
              echo "\`SHA256SUMS\` is signed with the project's minisign key:"
              echo
              echo '```sh'
              echo "minisign -V -p easy-nix.pub -m SHA256SUMS"
              echo '```'
              echo
              echo "Compare the key's fingerprint out of band before trusting it: a public key"
              echo "fetched from the same place as the signature proves nothing by itself."
            else
              echo "### Not signed"
              echo
              echo "No minisign key is configured yet, so \`SHA256SUMS\` ships unsigned. The build"
              echo "provenance attestation is the available alternative:"
              echo
              echo '```sh'
              echo "gh attestation verify $ISO --repo $REPO"
              echo '```'
            fi
            echo
            echo "### What is in the installed system"
            echo
            echo "| asset | what it is |"
            echo "| --- | --- |"
            echo "| \`closure-appliance-x86_64-linux.json\` | every store path of the system this image installs, with its NAR hash and size |"
            echo "| \`closure-sri-appliance-x86_64-linux.tsv\` | the same paths and hashes, in the encoding narinfo files use |"
            echo
            echo "The manifest describes the installed system, not this medium: an image's own"
            echo "closure stops at the ISO file, because the squashfs inside it is compressed and"
            echo "a reference scan cannot see the store paths within. It is what makes the claim"
            echo "\"you can check what you downloaded\" true without trusting whoever ran the build:"
            echo "compare it against your own store, or against cache.nixos.org with a plain GET."
            echo "The recipe is in the README."
            echo
            echo "### What this release does not do"
            echo
            echo "- no disk encryption and no dual boot: installing erases the target disk"
            echo "- no aarch64 ISO; ARM is an SD-card image, see the README"
            echo "- the boot test asserts the image reaches userspace, not that every"
            echo "  application in it launches"
            echo "- no automated install test: \`easy-nix-install\` has never partitioned a disk"
            echo "  in CI, see docs/install-test.md"
          } >RELEASE_NOTES.md
          cat RELEASE_NOTES.md
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: result/iso/*.iso
      - uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_NOTES.md
          # The parts, never the assembled image: it is over the 2 GiB asset limit, and
          # one oversized glob here is what makes this step fail after a 40-minute build.
          #
          # `SHA256SUMS*` rather than naming the signature: it exists only when the signing
          # key is configured, and a named file that is absent fails the whole step.
          files: |
            release/*.part-*
            SHA256SUMS*
            result-manifest/closure-*.json
            result-manifest/closure-sri-*.tsv
          fail_on_unmatched_files: true
