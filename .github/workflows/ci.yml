name: ci

on:
  push:
    branches: [main]
    # A documentation-only change cannot break an evaluation or a build, and the ISO build
    # is the most expensive thing here. The flake does embed its own source (the medium
    # carries the configuration it installs), so a doc change does alter the artifact -
    # which is why the release workflow, on a tag, always builds and boot-tests from
    # scratch rather than trusting the last green run.
    paths-ignore:
      - "**.md"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Formatting
        run: nix build .#checks.x86_64-linux.formatting -L
      - name: Static checks
        run: nix build .#checks.x86_64-linux.pre-commit-check -L

  eval:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every host, including the ARM one: an evaluation failure there is a broken
        # flake for anyone who tries it, and it costs seconds to catch.
        host:
          - easy-nix
          - easy-nix-live
          - easy-nix-live-test
          - easy-nix-arm
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Evaluate ${{ matrix.host }}
        run: nix eval --raw .#evalTargets.${{ matrix.host }}
      - name: Evaluate the release artifacts
        run: |
          # The size budgets and the closure manifest are part of every release page, so
          # an evaluation error in one of them is a broken release forty minutes into a
          # build. Evaluating them costs seconds.
          nix eval --raw .#packages.x86_64-linux.size-budget-installer.drvPath
          nix eval --raw .#packages.x86_64-linux.size-budget-test.drvPath
          nix eval --raw .#packages.x86_64-linux.closure-manifest-appliance.drvPath

  boot-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Make /dev/kvm usable
        run: |
          # The runner user is not in the kvm group and cannot reconnect mid-job, so a
          # udev rule is the only thing that works. Fail here rather than time out later.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -w /dev/kvm
      - name: Boot the light image, BIOS then EFI
        run: |
          # extra-sandbox-paths is the whole point: the runner having /dev/kvm is not
          # enough, because the build runs in a sandbox that does not expose it.
          nix build --option extra-sandbox-paths /dev/kvm -L .#checks.x86_64-linux.boot-test-bios
          nix build --option extra-sandbox-paths /dev/kvm -L .#checks.x86_64-linux.boot-test-efi

  iso:
    # Not on pull requests: a full ISO build is the most expensive thing here, and it
    # is the artifact of a merge to main or of a tag, not of an open proposal.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Free disk space
        run: |
          # A NixOS desktop closure (two browsers, LibreOffice, Steam), its squashfs and
          # the resulting ISO do not fit in the ~14 GB the default image leaves free:
          # the build otherwise dies with "No space left on device" several minutes in.
          # None of the paths below is used by this build.
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /opt/hostedtoolcache \
            /usr/local/share/boost
          sudo docker image prune -af || true
          df -h /
          # The paths above are the ones the current runner image uses, and that image
          # changes (`ubuntu-latest` migrates to Ubuntu 26 from October 2026). Check the
          # result here, where the message can say what is wrong, rather than letting the
          # build fail minutes later on a full disk.
          avail_gb=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          case "$avail_gb" in
            '' | *[!0-9]*)
              echo "::error::could not read free space from df" >&2
              exit 1
              ;;
          esac
          echo "free on /: ${avail_gb}G"
          if [ "$avail_gb" -lt 25 ]; then
            echo "::error::only ${avail_gb}G free on /; the ISO build needs about 25G" >&2
            exit 1
          fi
      - name: Build the installer ISO
        run: nix build .#packages.x86_64-linux.iso -L --max-jobs 4
      - name: Size and checksum
        run: |
          ls -lh result/iso/*.iso
          # Bare filenames, so that `sha256sum -c SHA256SUMS` works in the directory a
          # user downloaded into, where `result/iso/...` does not exist.
          (cd result/iso && sha256sum *.iso) > SHA256SUMS
          cat SHA256SUMS
      - name: Size budget and closure manifest
        run: |
          # Nearly free here: the image and the closure are already built, so these only
          # add their own derivations.
          #
          # --no-link, and it is not cosmetic: either build repoints ./result, and the
          # artifact upload below reads result/iso/*.iso. Without it the job goes green
          # while uploading a 231-byte archive with no image in it.
          nix build --no-link -L .#packages.x86_64-linux.size-budget-installer
          nix build --no-link -L .#packages.x86_64-linux.closure-manifest-appliance
      - name: Make /dev/kvm usable
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -w /dev/kvm
      - name: Boot the image that was just built, BIOS then EFI
        run: |
          # The light image is boot-tested in its own job; this is the same assertion
          # against the image that actually ships, so a release step is never the first
          # time it runs. Same runner as the build, so nothing is rebuilt.
          # --no-link: without it, `nix build` repoints ./result at the check's own output,
          # and the steps that follow (checksums, notes, artifact upload) then read a
          # ./result that no longer holds the ISO.
          nix build --no-link --option extra-sandbox-paths /dev/kvm -L .#checks.x86_64-linux.boot-test-release-bios
          nix build --no-link --option extra-sandbox-paths /dev/kvm -L .#checks.x86_64-linux.boot-test-release-efi
      - uses: actions/upload-artifact@v7
        with:
          name: easy-nix-iso
          path: |
            result/iso/*.iso
            SHA256SUMS
          if-no-files-found: error
          retention-days: 7
