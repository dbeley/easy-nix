name: ci

on:
  push:
    branches: [main]
    # A documentation-only change cannot break an evaluation or a build, and the ISO build
    # is the most expensive thing here. The flake does embed its own source (the medium
    # carries the configuration it installs), so a doc change does alter the artifact -
    # which is why the release workflow publishes the artifacts of the run that built a
    # commit, and never builds the same tree a second time.
    paths-ignore:
      - "**.md"
  pull_request:
    # The same filter as `push`, and it has to be written twice: a `push` filter does not
    # cover pull requests, and a README fix was paying for lint, four evaluations and a
    # boot test. Note what a filtered-out pull request reports: no check at all, rather
    # than a green one, so `ci` must not be a required check in branch protection while
    # this is in place.
    paths-ignore:
      - "**.md"
  workflow_dispatch:

# Pinned, not `-latest`: the ISO job frees disk space by removing paths that are specific
# to a runner image, and `ubuntu-latest` moves under it (it migrated to Ubuntu 26 in
# October 2026). A job that silently freed nothing would then fail on a full disk forty
# minutes into a build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Build provenance, filed by the job that produced the file rather than by a later job
  # that downloaded a copy: the attestation names this run's build, which is the claim
  # worth making.
  id-token: write
  attestations: write

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Formatting
        run: nix build .#checks.x86_64-linux.formatting -L
      - name: Static checks
        run: nix build .#checks.x86_64-linux.pre-commit-check -L

  eval:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Every host, including the ARM one: an evaluation failure there is a broken
        # flake for anyone who tries it, and it costs seconds to catch.
        host:
          - easy-nix
          - easy-nix-live
          - easy-nix-live-test
          - easy-nix-arm
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Evaluate ${{ matrix.host }}
        run: nix eval --raw .#evalTargets.${{ matrix.host }}
      - name: Evaluate the release artifacts
        run: |
          # The size budgets and the closure manifest are part of every release page, so
          # an evaluation error in one of them is a broken release forty minutes into a
          # build. Evaluating them costs seconds.
          nix eval --raw .#packages.x86_64-linux.size-budget-installer.drvPath
          nix eval --raw .#packages.x86_64-linux.size-budget-test.drvPath
          nix eval --raw .#packages.x86_64-linux.closure-manifest-appliance.drvPath

  boot-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Make /dev/kvm usable
        run: |
          # The runner user is not in the kvm group and cannot reconnect mid-job, so a
          # udev rule is the only thing that works. Fail here rather than time out later.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -w /dev/kvm
      - name: Boot the light image, BIOS then EFI
        run: |
          # extra-sandbox-paths is the whole point: the runner having /dev/kvm is not
          # enough, because the build runs in a sandbox that does not expose it.
          nix build --option extra-sandbox-paths /dev/kvm -L .#checks.x86_64-linux.boot-test-bios
          nix build --option extra-sandbox-paths /dev/kvm -L .#checks.x86_64-linux.boot-test-efi
      - name: Size budget of the light image
        run: |
          # This job already builds that image, so the budget is nearly free here - and
          # it has to run somewhere: a ceiling nothing ever measures against is not a
          # ceiling. The installer's own budget runs in the iso job, which builds the ISO.
          nix build --no-link -L .#packages.x86_64-linux.size-budget-test

  iso:
    # Not on pull requests: a full ISO build is the most expensive thing here, and it
    # is the artifact of a merge to main or of a tag, not of an open proposal.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Free disk space
        run: |
          # A NixOS desktop closure (two browsers, LibreOffice, Steam), its squashfs and
          # the resulting ISO do not fit in the ~14 GB the default image leaves free:
          # the build otherwise dies with "No space left on device" several minutes in.
          # None of the paths below is used by this build.
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /opt/hostedtoolcache \
            /usr/local/share/boost
          sudo docker image prune -af || true
          df -h /
          # The paths above are the ones this runner image uses. The runner is pinned in
          # the `runs-on` above precisely so they stay the right ones; check the result
          # here anyway, where the message can say what is wrong, rather than letting the
          # build fail minutes later on a full disk.
          avail_gb=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          case "$avail_gb" in
            '' | *[!0-9]*)
              echo "::error::could not read free space from df" >&2
              exit 1
              ;;
          esac
          echo "free on /: ${avail_gb}G"
          if [ "$avail_gb" -lt 25 ]; then
            echo "::error::only ${avail_gb}G free on /; the ISO build needs about 25G" >&2
            exit 1
          fi
      - name: Build the installer ISO
        run: nix build .#packages.x86_64-linux.iso -L --max-jobs 4
      - name: Size budget and closure manifest
        run: |
          # Nearly free here: the image and the closure are already built, so these only
          # add their own derivations.
          #
          # --no-link for the budget, and it is not cosmetic: that build repoints ./result,
          # and the steps below read result/iso/*.iso. Without it the job goes green while
          # uploading a 231-byte archive with no image in it.
          #
          # The manifest keeps an out-link of its own (`result-manifest`), because the
          # release publishes these files and the release job must not rebuild them: they
          # were computed from the very system this run built and tested.
          nix build --no-link -L .#packages.x86_64-linux.size-budget-installer
          nix build -L --out-link result-manifest .#packages.x86_64-linux.closure-manifest-appliance
      - name: Size and checksum
        run: |
          ls -lh ./result/iso/*.iso ./result-manifest/
          # Bare filenames, so that `sha256sum -c SHA256SUMS` works in the directory a
          # user downloaded into, where `result/iso/...` does not exist.
          #
          # The manifest is covered too: this is the one document that lists everything
          # the release publishes, and it is the one that gets signed.
          (cd result/iso && sha256sum ./*.iso) > SHA256SUMS
          (cd result-manifest && sha256sum ./closure-*.json ./closure-sri-*.tsv) >> SHA256SUMS
          cat SHA256SUMS
      - name: Make /dev/kvm usable
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -w /dev/kvm
      - name: Boot the image that was just built, BIOS then EFI
        run: |
          # The light image is boot-tested in its own job; this is the same assertion
          # against the image that actually ships, so a release step is never the first
          # time it runs. Same runner as the build, so nothing is rebuilt.
          # --no-link: without it, `nix build` repoints ./result at the check's own output,
          # and the steps that follow (checksums, artifact upload) then read a ./result
          # that no longer holds the ISO.
          nix build --no-link --option extra-sandbox-paths /dev/kvm -L .#checks.x86_64-linux.boot-test-release-bios
          nix build --no-link --option extra-sandbox-paths /dev/kvm -L .#checks.x86_64-linux.boot-test-release-efi
      - name: Install, then boot what was installed
        run: |
          # The path nothing else covers: the installer partitioning a disk, and the
          # installed system starting on its own. It builds its own light medium, which
          # is why it runs here rather than in the fast job: the closure is warm, and a
          # medium is what this job exists to build.
          # --no-link for the same reason as above: the artifact upload below reads
          # result/iso/*.iso, so ./result has to keep pointing at the ISO.
          # `sandbox = false` is for this check alone, and for one reason: a Nix build
          # sandbox has no network by design, so QEMU running inside it hands the guest an
          # environment with no resolver at all. The diagnostic the harness prints before it
          # starts any machine showed exactly that - an empty nameserver list - and every
          # lookup inside the guest then failed while the link itself was up.
          #
          # It also explains the shape of the investigation: a public resolver made it
          # worse, some fetches succeeded anyway (fixed-output derivations get the network
          # from the daemon, not from the sandbox), and running this same script by hand on
          # a developer machine always worked.
          #
          # The boot tests need no network, so they stay sandboxed.
          nix build --no-link --option extra-sandbox-paths /dev/kvm --option sandbox false \
            -L .#checks.x86_64-linux.install-test
      # The provenance is filed here, by the job that built the file, and not by the
      # release job that later downloads a copy: an attestation is about a digest, so it
      # verifies any copy - but only if the thing that attests it watched it being built.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: result/iso/*.iso
      # Everything the release publishes, from the run that tested it. 90 days is the
      # maximum, and the point of the artifact: a tag pushed weeks after the merge still
      # finds the bytes this run built and boot-tested, instead of building the same tree
      # again and publishing bytes no test ever saw.
      - uses: actions/upload-artifact@v7
        with:
          name: easy-nix-release
          path: |
            result/iso/*.iso
            result-manifest/closure-*.json
            result-manifest/closure-sri-*.tsv
            SHA256SUMS
          if-no-files-found: error
          retention-days: 90
